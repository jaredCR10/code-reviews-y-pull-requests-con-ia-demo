# Pipeline de integración continua
# Se ejecuta en cada pull request hacia main y en cada push a main.
# Sus dos jobs ("backend" y "frontend") se configuran como checks obligatorios
# en la protección de rama: si alguno falla, GitHub bloquea el merge.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Si se hace push de nuevo al mismo PR, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Verificar estándares de código (Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Compilar y ejecutar pruebas (H2 en memoria, sin MySQL)
        run: ./mvnw -B verify -Dcheckstyle.skip=true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Ejecutar pruebas (Vitest)
        run: npm test -- --watch=false
